# CodeRabbit configuration — https://docs.coderabbit.ai/reference/configuration
# Requires the CodeRabbit GitHub App to be installed on this repo
# (https://github.com/apps/coderabbitai) before it takes effect.

language: "en-US"

tone_instructions: >-
  Be terse and specific. Point at the exact file/line and the concrete
  failure scenario instead of general observations. Skip praise and
  restating what the diff already makes obvious.

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "!dist/**"
    - "!lib/**"
    - "!node_modules/**"
    - "!package-lock.json"

  path_instructions:
    - path: "src/**/*.ts"
      instructions: |
        This is a GitHub Action's source, bundled by esbuild into
        dist/index.js and run directly by the Actions runtime — there is no
        install step for consumers, so a runtime error here fails every
        workflow that uses this action.

        Flag any type assertion (`as Foo`, `as unknown as Foo`) or
        non-null assertion (`!`). Both are already errors under this repo's
        oxlint config (typescript/consistent-type-assertions: never,
        typescript/no-non-null-assertion) — a slip here means either an
        oxlint suppression was added or the rule is being bypassed some
        other way, either of which is worth flagging on its own. Prefer
        narrowing or validating the value instead.

    - path: "src/authorization.ts"
      instructions: |
        `AUTHORIZED_ASSOCIATIONS` here and the cost-guard `if:` generated
        into .github/workflows/reusable.yml and README.md by
        scripts/generate-cost-guard.mjs must stay in sync. A change to the
        authorized-association list without a corresponding
        `npm run generate:cost-guard` run (checked by `npm run
        check:cost-guard` in CI) will pass this file's own logic while
        leaving the generated gate stale.

    - path: "README.md"
      instructions: |
        The blocks between `<!-- cost-guard-if:begin -->`/`:end` and any
        `dfadler/issue-bot@<sha>` / `ref:` pins are generated by
        scripts/generate-cost-guard.mjs and scripts/generate-sha-pins.mjs —
        flag a hand-edit to either as likely to be reverted by the next
        `npm run generate:*` run, rather than reviewing it as intentional
        prose.

    - path: "scripts/*.mjs"
      instructions: |
        These are non-interactive Node scripts invoked from npm scripts and
        CI, not application code — flag missing error handling around
        filesystem/network calls, but don't ask for CLI ergonomics (help
        text, argument parsing frameworks) beyond what the script already
        has.

  tools:
    github-checks:
      timeout_ms: 300000

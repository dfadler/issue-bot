name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without a leading v (e.g. 1.2.3)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 - the default shallow, tag-less clone would leave
      # generate-sha-pins.mjs unable to resolve any tag README.md pins to
      # other than the ones this run itself force-moves (e.g. an older
      # `vX.Y.Z` an illustrative example still references).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be semver without a leading 'v' (e.g. 1.2.3), got: $VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:action-runtime

      # ISSUE_BOT_VERSION is baked into dist/index.js by scripts/build.mjs so
      # the running action knows which release it is - the input to its
      # `version-check` against the latest vX.Y.Z tag. Only this workflow
      # sets it; every other build is a "dev build" that skips the check.
      - run: npm run build
        env:
          ISSUE_BOT_VERSION: ${{ inputs.version }}

      - name: Publish release commit and tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # The bundle must carry the version it's about to be tagged as;
          # otherwise consumers of this tag could never be told they're stale.
          if ! grep -qF "\"${VERSION}\"" dist/index.js; then
            echo "::error::dist/index.js does not contain the release version \"${VERSION}\" - was ISSUE_BOT_VERSION passed to the build step?"
            exit 1
          fi

          major="v${VERSION%%.*}"
          full="v${VERSION}"
          release_branch="releases/${major}"
          source_sha=$(git rev-parse HEAD)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # dist/index.js is gitignored on main; force-add this run's build so
          # the release commit is self-contained and runnable by anyone who
          # checks out this ref directly.
          git add -f dist/index.js
          git commit -m "release: ${full} (from ${source_sha})"

          git branch -f "$release_branch" HEAD
          git tag -f "$full" HEAD
          git tag -f "$major" HEAD

          git push origin "$release_branch" --force
          git push origin "refs/tags/${full}" --force
          git push origin "refs/tags/${major}" --force

          echo "Released ${full}, moved ${major} to $(git rev-parse HEAD)"

      # This publishes the ready-to-paste line with the release commit's
      # SHA as a GitHub Release too, for pinning to *that specific* release
      # later rather than always tracking the latest `v1` shown in README.md.
      - name: Publish GitHub Release with a pinned usage snippet
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          major="v${VERSION%%.*}"
          full="v${VERSION}"
          release_sha=$(git rev-parse "$full")
          notes_file=$(mktemp)

          cat > "$notes_file" <<'NOTES'
          ## Usage

          Pin to this release's exact commit instead of the mutable `__MAJOR__`/`__FULL__` tags - see the [README](https://github.com/dfadler/issue-bot/blob/__SHA__/README.md#usage) for why that matters.

          ```yaml
          - uses: dfadler/issue-bot@__SHA__ # __FULL__
          ```

          Or with the [reusable workflow](https://github.com/dfadler/issue-bot/blob/__SHA__/README.md#reusable-workflow):

          ```yaml
          jobs:
            issue-bot:
              uses: dfadler/issue-bot/.github/workflows/reusable.yml@__SHA__ # __FULL__
              permissions:
                issues: write
                pull-requests: write
              with:
                ref: __SHA__ # __FULL__
          ```
          NOTES

          sed -i -e "s/__SHA__/${release_sha}/g" -e "s/__FULL__/${full}/g" -e "s/__MAJOR__/${major}/g" "$notes_file"

          if gh release view "$full" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$full" --repo "${{ github.repository }}" --title "$full" --notes-file "$notes_file"
          else
            gh release create "$full" --repo "${{ github.repository }}" --title "$full" --notes-file "$notes_file"
          fi

          echo "Published GitHub Release ${full} pinned to ${release_sha}"

      # The release commit above can't reference its own hash (it doesn't
      # exist yet while that commit is being written), so README.md's pins
      # can't be updated as part of it. Once the tags above exist, the SHA
      # they point to is known - this rewrites README.md's own examples to it
      # via scripts/generate-sha-pins.mjs and opens a PR with the result,
      # because `main` is protected and rejects direct pushes.
      #
      # Runs after the GitHub Release step and is non-fatal: a failure here
      # (e.g. the repo disallowing Actions-created PRs) must not mask a
      # release that otherwise published. PRs opened with GITHUB_TOKEN don't
      # trigger required status checks - push an empty commit to the
      # branch (or close/reopen the PR) to run them before merging.
      - name: Open PR updating README's pinned commit SHAs
        continue-on-error: true
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # HEAD is the detached release commit (which bundles dist/index.js);
          # branch from main fresh so that commit doesn't land in the PR.
          git fetch origin main
          git checkout -B "chore/readme-pins-v${VERSION}" origin/main

          npm run generate:sha-pins

          if git diff --quiet -- README.md; then
            echo "README.md already up to date; nothing to commit."
          else
            git add README.md
            git commit -m "docs: update README's pinned commit SHAs for v${VERSION}"
            git push origin "chore/readme-pins-v${VERSION}" --force
            gh pr create --repo "${{ github.repository }}" \
              --base main --head "chore/readme-pins-v${VERSION}" \
              --title "docs: update README's pinned commit SHAs for v${VERSION}" \
              --body "Automated by the Release workflow."
          fi

name: issue-bot (reusable)

on:
  workflow_call:
    inputs:
      mention:
        description: "The mention string that triggers issue creation."
        required: false
        type: string
        default: "@issue-bot"
      label:
        description: "Label applied to filed issues (auto-created if missing). Set to an empty string to skip labeling."
        required: false
        type: string
        default: "from-pr-comment"
      version-check:
        description: "What to do when the pinned `ref` is older than the latest dfadler/issue-bot release: \"fail\", \"warn\", or \"off\". See the issue-bot README."
        required: false
        type: string
        default: "fail"
      ref:
        description: "The dfadler/issue-bot ref to run the action from. Defaults to the v1 tag; pin to a commit SHA for the same reason the README recommends it for the plain action usage."
        required: false
        type: string
        default: "v1"
    secrets:
      github-token:
        description: "Token used to read comments and create issues/labels. Defaults to the calling job's GITHUB_TOKEN if not provided."
        required: false
    outputs:
      filed:
        description: "\"true\" if a new issue was filed, \"false\" otherwise (no mention, or an issue already covers this comment)."
        value: ${{ jobs.issue-bot.outputs.filed }}
      issue-number:
        description: "The number of the filed issue, if one was filed."
        value: ${{ jobs.issue-bot.outputs.issue-number }}
      issue-url:
        description: "The URL of the filed issue, or of the existing issue that already covers this comment."
        value: ${{ jobs.issue-bot.outputs.issue-url }}

jobs:
  issue-bot:
    # Cost guard: mirrors (does not tighten) the checks the action already
    # makes internally — a matching mention, a PR context (not a plain issue,
    # for issue_comment), a non-bot author, and write access
    # (OWNER/MEMBER/COLLABORATOR) — so a comment that the action would just
    # say no to in a few seconds skips before a runner is even requested,
    # billing zero minutes instead of GitHub's 1-minute floor. See
    # dfadler/issue-bot#42 for the cost audit this is based on. Because a
    # job's `if:` can't call the action's own regex-based mention matcher,
    # this uses a plain substring `contains()` — looser than the action's
    # word-boundary check, but only ever lets more runs through, never fewer,
    # so no legitimate `@issue-bot` invocation is affected.
    if: >-
      contains(github.event.comment.body, inputs.mention) &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null) &&
      github.event.comment.user.type != 'Bot' &&
      (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    outputs:
      filed: ${{ steps.run.outputs.filed }}
      issue-number: ${{ steps.run.outputs.issue-number }}
      issue-url: ${{ steps.run.outputs.issue-url }}
    steps:
      # `uses:` doesn't accept an expression (actionlint flags
      # `dfadler/issue-bot@${{ inputs.ref }}` directly), so `inputs.ref` is
      # threaded through a checkout instead: this pulls the action's own
      # code at that ref, then `uses: ./` runs it from the local checkout.
      - name: Checkout dfadler/issue-bot@${{ inputs.ref }}
        uses: actions/checkout@v7
        with:
          repository: dfadler/issue-bot
          ref: ${{ inputs.ref }}
          path: .issue-bot-action

      - id: run
        uses: ./.issue-bot-action
        with:
          mention: ${{ inputs.mention }}
          label: ${{ inputs.label }}
          github-token: ${{ secrets.github-token || github.token }}
          version-check: ${{ inputs.version-check }}

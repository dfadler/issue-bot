name: "PR Comment Issue Bot"
description: "File a GitHub issue from a PR comment by mentioning @issue-bot, capturing the comment, its thread, and the related code."
author: "dfadler"

inputs:
  mention:
    description: "The mention string that triggers issue creation."
    required: false
    default: "@issue-bot"
  label:
    description: "Label applied to filed issues (auto-created if missing). Set to an empty string to skip labeling."
    required: false
    default: "from-pr-comment"
  github-token:
    description: "Token used to read comments and create issues/labels. Defaults to the repo-scoped GITHUB_TOKEN; pass a GitHub App installation token (e.g. via actions/create-github-app-token) for App-authored issues/comments — see README."
    required: false
    default: ${{ github.token }}
  version-check:
    description: "What to do when this pinned version of issue-bot is older than the latest dfadler/issue-bot release: \"fail\" (default) fails the run with the exact `uses:` line to update to, \"warn\" logs the same as a warning and continues, \"off\" skips the check. Lookup errors (network, rate limit) only ever warn — see README."
    required: false
    default: "fail"

outputs:
  filed:
    description: "\"true\" if a new issue was filed, \"false\" otherwise (no mention, or an issue already covers this comment)."
  issue-number:
    description: "The number of the filed issue, if one was filed."
  issue-url:
    description: "The URL of the filed issue, or of the existing issue that already covers this comment."

runs:
  using: "node24"
  main: "dist/index.js"

branding:
  icon: "file-plus"
  color: "purple"
